<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darul-Arkom · Register</title>
    <!-- Favicon Logo -->
    <link
      rel="icon"
      type="image/jpeg"
      href="./images/android-chrome-512x512.png "
    />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome CDN -->
    <script
      src="https://kit.fontawesome.com/33613caafb.js"
      crossorigin="anonymous"
    ></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Apply Inter font to ALL elements consistently */
      body,
      body * {
        font-family: "Inter", sans-serif !important;
      }
      /* Keep Arabic text with Amiri */
      .font-arabic {
        font-family: "Amiri", serif !important;
      }

      /* Solid buttons – no gradients, no stripes */
      .btn-green {
        background-color: #15803d !important;
        color: white !important;
        transition:
          background-color 0.2s,
          transform 0.2s;
      }
      .btn-green:hover {
        background-color: #166534 !important;
        transform: scale(1.02);
      }

      .btn-gold {
        background-color: #fbbf24 !important;
        color: #000000 !important;
        transition:
          background-color 0.2s,
          transform 0.2s;
      }
      .btn-gold:hover {
        background-color: #f59e0b !important;
        transform: scale(1.02);
      }

      .btn-black {
        background-color: #000000 !important;
        color: white !important;
        transition:
          background-color 0.2s,
          r transform 0.2s;
      }
      .btn-black:hover {
        background-color: #1a1a1a !important;
        transform: scale(1.02);
      }

      .btn-outline-gold {
        border: 2px solid #fbbf24 !important;
        color: #fbbf24 !important;
        background: transparent !important;
        transition:
          background 0.2s,
          color 0.2s,
          transform 0.2s;
      }
      .btn-outline-gold:hover {
        background: #fbbf24 !important;
        color: #000000 !important;
        transform: scale(1.02);
      }

      .hover-lift {
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .hover-lift:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(21, 128, 61, 0.15);
      }

      /* custom checkmark */
      .custom-check:checked + label .checkmark {
        background-color: #15803d;
        border-color: #15803d;
      }
      .custom-check:checked + label .checkmark::after {
        content: "✓";
        display: block;
        color: white;
        font-size: 14px;
        line-height: 20px;
        text-align: center;
      }
      .checkmark {
        width: 20px;
        height: 20px;
        border: 2px solid #aaa;
        border-radius: 4px;
        display: inline-block;
        flex-shrink: 0;
        transition: 0.2s;
        background: white;
      }
    </style>
  </head>
  <body
    class="bg-white text-black flex items-center justify-center md:overflow-hidden h-screen bg-[url('/images/image.png')] bg-cover bg-center"
  >
    <!-- lef side – features / branding -->
    <div
      class="w-full md:w-screen md:h-screen hidden bg-[url('/images/boy.png')] bg-cover bg-center p-8 md:p-10 md:flex flex-col justify-between text-white"
    >
      <div>
        <div class="flex items-center gap-2 mb-6">
          <img
            src="./images/favicon.ico"
            alt="Darul-Arkom"
            class="w-10 h-10 rounded-full border-2 border-gold object-cover"
          />
          <span class="text-gold font-bold text-lg">Darul-Arkom</span>
        </div>
      </div>

      <div class="mt-8 pt-6 border-t border-white/10 text-sm text-white/50">
        <p>Join thousands of students worldwide</p>
      </div>
    </div>
    <!-- left side – form -->
    <div
      class="w-full md:w-screen md:h-screen l p-8 md:p-10 md:pt-o pt-32 md:pr-5 md:relative md:left-11"
    >
      <h1
        class="text-3xl md:text-4xl md:pt-0 pt-32 font-extrabold text-black tracking-tight"
      >
        Get Started!
      </h1>

      <!-- form -->
      <form
        action="https://formspree.io/f/mbgrevyk"
        method="post"
        class="space-y-4 pt-6"
      >
        <div>
          <label
            class="block text-xs font-semibold text-black/70 uppercase tracking-wider mb-1"
          >
            Full Name
          </label>
          <input
            reqired
            name=" Full Name"
            id="full-name"
            type="text"
            placeholder="John Doe"
            required
            class="w-full border border-black/20 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#15803d] focus:border-transparent"
          />
        </div>

        <div>
          <label
            class="block text-xs font-semibold text-black/70 uppercase tracking-wider mb-1"
          >
            Email
          </label>
          <input
            name="email"
            id="email"
            type="email"
            placeholder="you@email.com"
            required
            class="w-full border border-black/20 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#15803d] focus:border-transparent"
          />
        </div>

        <div>
          <label
            class="block text-xs font-semibold text-black/70 uppercase tracking-wider mb-1"
            >Phone Number (Whatsapp)</label
          >
          <input
            required
            name="Phone Number"
            id="Phone Number"
            type="Phone Number"
            placeholder="+234 902 889 4445"
            class="w-full border border-black/20 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#15803d] focus:border-transparent"
          />
        </div>
        <div>
          <label
            class="block text-xs font-semibold text-black/70 uppercase tracking-wider mb-1"
            >Nationality</label
          >
          <input
            required
            name="Nationality"
            id="Nationality"
            type="text"
            placeholder="Nigerian"
            class="w-full border border-black/20 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#15803d] focus:border-transparent"
          />
        </div>

        <div class="flex flex-col gap-2 w-full font-sans">
          <label for="course" class="text-[15px] font-medium text-[#0d2a4a]">
            Course
          </label>

          <div class="relative w-full">
            <select
              id="course"
              required
              class="w-full appearance-none bg-[#fbfbf4] focus:outline-none focus:ring-2 focus:ring-[#15803d] focus:border-transparent rounded-[10px] py-[10px] pl-[14px] pr-[36px] text-sm text-[#0d2a4a] outline-none cursor-pointer transition-all"
            >
              <option value="beginner">Beginner Class (Roadoh)</option>

              <option value="tajweed">Ibtidaahi I</option>
              <option value="tajweed">Tahfeedh Programm</option>
              <option value="tajweed">Ibtidaahi II</option>
              <option value="tajweed">Ibtidaahi III</option>
              <option value="tajweed">Edaadih I</option>
            </select>

            <!-- Custom Chevron Icon -->
            <div
              class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3.5"
            >
              <i class="fa-solid fa-chevron-down"></i>
            </div>
          </div>
        </div>
        <div>
          <label
            class="block text-xs font-semibold text-black/70 uppercase tracking-wider mb-1"
            >Category:</label
          >
          <div class="flex gap-3">
            <!-- Inpute type "radio" name"gender" Value="male"  -->
            <input type="radio" name="gender" value="male" required />Kids
            <input type="radio" name="gender" value="female" required />Adult
          </div>
        </div>
        <div class="flex flex-col gap-2 w-full max-w-xs font-sans md:hidden">
          <label
            class="block text-sm font-semibold text-black/70 uppercase tracking-wider mb-1"
            >Are you Interested in our Tahfeedh Program</label
          >
          <div class="flex gap-8">
            <!-- Inpute type "radio" name"gender" Value="male"  -->
            <input type="radio" name="gender" value="male" required /><span
              class="flex gap-0 items-center text-center"
              >Yes</span
            >
            <input type="radio" name="gender" value="female" required /><span
              class="flex gap-0 items-center text-center"
              >No</span
            >
          </div>
        </div>
        <!-- register button -->
        <button
          type="submit"
          class="w-full btn-green py-3.5 rounded-xl text-base font-bold mt-2 hover:shadow-lg transition"
        >
          REGISTER
        </button>
      </form>
    </div>

    <a href="./index.html"
      ><div
        class="text-[#138844 ] text-xl md:flex md:flex-row justify-between text-center md:items-center relative right-20 -top-60 gap-2 hidden"
      >
        <i class="fa-solid fa-arrow-left"></i><a href="./index.html"> Back </a>
      </div></a
    >
    <!-- small note: inline script just for demo (no extra logic needed) -->
    <script>
      // any extra interactivity can go here (e.g. checkbox styling)
      console.log("Darul-Arkom registration page loaded");
    </script>
  </body>
</html>
