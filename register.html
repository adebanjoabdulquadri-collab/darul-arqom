<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darul-Arkom · Register</title>
    <!-- Favicon Logo -->
    <link
      rel="icon"
      type="image/jpeg"
      href="./images/android-chrome-512x512.png "
    />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome CDN -->
    <script
      src="https://kit.fontawesome.com/33613caafb.js"
      crossorigin="anonymous"
    ></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Apply Inter font to ALL elements consistently */
      body,
      body * {
        font-family: "Inter", sans-serif !important;
      }
      /* Keep Arabic text with Amiri */
      .font-arabic {
        font-family: "Amiri", serif !important;
      }

      /* Solid buttons – no gradients, no stripes */
      .btn-green {
        background-color: #15803d !important;
        color: white !important;
        transition:
          background-color 0.2s,
          transform 0.2s;
      }
      .btn-green:hover {
        background-color: #166534 !important;
        transform: scale(1.02);
      }

      .btn-gold {
        background-color: #fbbf24 !important;
        color: #000000 !important;
        transition:
          background-color 0.2s,
          transform 0.2s;
      }
      .btn-gold:hover {
        background-color: #f59e0b !important;
        transform: scale(1.02);
      }

      .btn-black {
        background-color: #000000 !important;
        color: white !important;
        transition:
          background-color 0.2s,
          transform 0.2s;
      }
      .btn-black:hover {
        background-color: #1a1a1a !important;
        transform: scale(1.02);
      }

      .btn-outline-gold {
        border: 2px solid #fbbf24 !important;
        color: #fbbf24 !important;
        background: transparent !important;
        transition:
          background 0.2s,
          color 0.2s,
          transform 0.2s;
      }
      .btn-outline-gold:hover {
        background: #fbbf24 !important;
        color: #000000 !important;
        transform: scale(1.02);
      }

      .hover-lift {
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .hover-lift:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(21, 128, 61, 0.15);
      }

      /* custom checkmark */
      .custom-check:checked + label .checkmark {
        background-color: #15803d;
        border-color: #15803d;
      }
      .custom-check:checked + label .checkmark::after {
        content: "✓";
        display: block;
        color: white;
        font-size: 14px;
        line-height: 20px;
        text-align: center;
      }
      .checkmark {
        width: 20px;
        height: 20px;
        border: 2px solid #aaa;
        border-radius: 4px;
        display: inline-block;
        flex-shrink: 0;
        transition: 0.2s;
        background: white;
      }
    </style>
  </head>
  <body
    class="bg-white text-black flex items-center justify-center md:overflow-hidden h-screen bg-[url('/images/image.png')] bg-cover bg-center"
  >
    <!-- main card – clean, white, black/green/gold only -->
    <div
      class="w-full md:w-screen md:h-screen max-w-4xl bg-white rounded-3xl shadow-xl border border-black/10 overflow-hidden flex flex-col md:flex-row"
    >
      <!-- lef side – features / branding -->
      <div
        class="w-full md:w-screen md:h-screen hidden bg-[url('/images/boy.png')] bg-cover bg-center p-8 md:p-10 md:flex flex-col justify-between text-white"
      >
        <div>
          <div class="flex items-center gap-2 mb-6">
            <img
              src="./images/favicon.ico"
              alt="Darul-Arkom"
              class="w-10 h-10 rounded-full border-2 border-gold object-cover"
            />
            <span class="text-gold font-bold text-lg">Darul-Arkom</span>
          </div>
        </div>

        <div class="mt-8 pt-6 border-t border-white/10 text-sm text-white/50">
          <p>Join thousands of students worldwide</p>
        </div>
      </div>
      <!-- left side – form -->
      <div class="w-full md:w-screen md:h-screen l p-8 md:p-10 md:pt-o pt-12">
        <h1
          class="text-3xl md:text-4xl font-extrabold text-black tracking-tight"
        >
          Get Started!
        </h1>

        <!-- form -->
        <form class="space-y-4 pt-6">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label
                class="block text-xs font-semibold text-black/70 uppercase tracking-wider mb-1"
                >Name</label
              >
              <input
                type="text"
                placeholder="Name"
                class="w-full border border-black/20 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
              />
            </div>
            <div>
              <label
                class="block text-xs font-semibold text-black/70 uppercase tracking-wider mb-1"
                >Last Name</label
              >
              <input
                type="text"
                placeholder="Last Name"
                class="w-full border border-black/20 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
              />
            </div>
          </div>

          <div>
            <label
              class="block text-xs font-semibold text-black/70 uppercase tracking-wider mb-1"
              >Email</label
            >
            <input
              type="email"
              placeholder="you@email.com"
              class="w-full border border-black/20 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
            />
          </div>

          <div>
            <label
              class="block text-xs font-semibold text-black/70 uppercase tracking-wider mb-1"
              >Phone Number</label
            >
            <input
              type="password"
              placeholder="+234 902 889 4445"
              class="w-full border border-black/20 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
            />
          </div>
          <div>
            <label
              class="block text-xs font-semibold text-black/70 uppercase tracking-wider mb-1"
              >Address</label
            >
            <input
              type="text"
              placeholder="12 Emmanuel Keshi Street, Magodo Phase 2, Ikeja, Lagos, Nigeria"
              class="w-full border border-black/20 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
            />
          </div>
          <div class="">
            <!-- Label linked to the select dropdown via the 'id' -->
            <label
              start="course-selection"
              class="block text-xs font-semibold text-black/70 uppercase tracking-wider mb-1"
            >
              Select your Course:
            </label>

            <!-- Dropdown menu container -->
            <select
              name="selected_course"
              id="course-selection"
              required
              style="
                width: 100%;
                padding: 8px;
                border-radius: 4px;
                border: 1px solid #ccc;
              "
            >
              <!-- Placeholder option -->
              <option value="">-- Select a Course --</option>

              <!-- Science Department Group -->
              <optgroup label="Qur'an memorization">
                <option value="bio_101">Tajweed Mastery</option>
                <option value="chem_101">Qur'an Memorisation</option>
                <option value="eng_101">Tamhidiyya (Beginner level)</option>
                <option value="eng_101">Ibtidaiyya (Preparatory level)</option>
                <!-- Pre-selected default course -->
                <option value="math_101" selected>Available Classes</option>
              </optgroup>
            </select>
          </div>
          <!-- terms -->
          <div class="flex items-start gap-3 mt-2">
            <input type="checkbox" id="terms" class="custom-check hidden" />
            <label
              for="terms"
              class="flex items-start gap-3 cursor-pointer text-sm text-black/70"
            >
              <span class="checkmark mt-0.5"></span>
              <span class=""
                >I agree to the
                <strong class="text-primary">Terms & Conditions</strong> and
                <strong class="text-primary">Privacy Policy</strong></span
              >
            </label>
          </div>

          <!-- register button -->
          <button
            type="submit"
            class="w-full btn-green py-3.5 rounded-xl text-base font-bold mt-2 hover:shadow-lg transition"
          >
            REGISTER
          </button>
        </form>
      </div>
    </div>

    <!-- small note: inline script just for demo (no extra logic needed) -->
    <script>
      // any extra interactivity can go here (e.g. checkbox styling)
      console.log("Darul-Arkom registration page loaded");
    </script>
  </body>
</html>
